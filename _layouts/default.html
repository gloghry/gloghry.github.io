<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <script src="{{ '/assets/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Garett Loghry<span aria-hidden="true">.</span></a>
    <nav aria-label="Main navigation">
      {% assign paths = '/projects/,/writing/,/about/' | split: ',' %}
      {% assign names = 'Projects,Writing,About' | split: ',' %}
      {% for path in paths %}<a href="{{ path | relative_url }}"{% if page.url contains path %} aria-current="page"{% endif %}>{{ names[forloop.index0] }}</a>{% endfor %}
    </nav>
    <button id="theme-toggle" type="button" hidden aria-label="Switch color theme">Theme</button>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap"><span>Garett Loghry</span><a href="https://github.com/gloghry">GitHub</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
</body>
</html>
