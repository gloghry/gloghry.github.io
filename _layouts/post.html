---
layout: default
---
<article class="prose">
  <a href="{{ '/writing/' | relative_url }}">← All writing</a>
  <header class="page-heading"><p class="eyebrow">Writing</p><h1>{{ page.title | escape }}</h1><p class="muted"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% for tag in page.tags %} · {{ tag | escape }}{% endfor %}</p></header>
  {{ content }}
</article>
