name: Build and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASEURL: "" # User site at the domain root; set a subpath here for project sites.
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test link checker
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Download verified fonts
        run: python3 scripts/fetch_fonts.py
      - name: Prepare portrait
        run: python3 scripts/prepare_portrait.py
      - name: Build site
        run: bundle exec jekyll build --trace --baseurl "$SITE_BASEURL"
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: python3 scripts/check_links.py _site --baseurl "$SITE_BASEURL"
      - name: Check Cloudflare preview builds at root and subpath
        run: |
          python3 scripts/build_preview.py --url "https://ci-preview.pages.dev" --destination "$RUNNER_TEMP/preview-root"
          python3 scripts/build_preview.py --url "https://ci-preview.pages.dev" --baseurl "/portfolio" --destination "$RUNNER_TEMP/preview-subpath"
          test ! -e _site/_headers
          if rg -q 'name="robots" content="noindex' _site/index.html; then
            echo "Preview robots metadata leaked into production output"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-audit" --no-save --package-lock=false playwright@1.65.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/site-audit/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Audit configured deployment path
        run: node scripts/audit_site.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/site-audit/node_modules
      - name: Audit alternate root or subpath deployment
        run: |
          if [ -z "$SITE_BASEURL" ]; then
            audit_base="/portfolio"
          else
            audit_base=""
          fi
          bundle exec jekyll build --trace --baseurl "$audit_base" --destination "$RUNNER_TEMP/alternate-site"
          python3 scripts/check_links.py "$RUNNER_TEMP/alternate-site" --baseurl "$audit_base"
          SITE_BASEURL="$audit_base" SITE_DIRECTORY="$RUNNER_TEMP/alternate-site" AUDIT_OUTPUT_DIR="audit-results/alternate" node scripts/audit_site.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/site-audit/node_modules
          JEKYLL_ENV: production
      - name: Upload browser audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: audit-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
