name: Build and deploy site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASEURL: "" # User site at the domain root; set a subpath here for project sites.
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Test link checker
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Download verified fonts
        run: python3 scripts/fetch_fonts.py
      - name: Prepare portrait
        run: python3 scripts/prepare_portrait.py
      - name: Build site
        run: bundle exec jekyll build --trace --baseurl "$SITE_BASEURL"
        env:
          JEKYLL_ENV: production
      - name: Check internal links
        run: python3 scripts/check_links.py _site --baseurl "$SITE_BASEURL"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
