name: Work item
description: Propose a change, report a problem, or track a decision.
body:
  - type: markdown
    attributes:
      value: |
        Choose Bug, Feature, or Task in GitHub's issue type control and set the native Priority field when available.
        Set Effort as a provisional scope estimate and Start date when work begins; no Target/end date is required.
        The optional priority answer below is a body fallback,
        not a native issue field. If using multiple representations, keep them consistent.
        Priority is separate from effort and readiness. Priority labels are retired; see CONTRIBUTING.md for field/body fallback rules.
        Keep private mailbox details, passwords, and other secrets out of public issues.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Optional temporary body fallback when native field access is unavailable. Do not use priority to represent missing input.
      multiple: false
      options:
        - Urgent (P0) — Highest priority
        - High (P1) — Near-term
        - Medium (P2) — Follow-up
        - Low (P3) — Optional exploration
    validations:
      required: false
  - type: textarea
    id: rationale
    attributes:
      label: Priority rationale
      description: Explain the priority if using the body fallback, or record a deliberate priority change.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Goal and scope
      description: Describe the problem, desired outcome, and relevant examples.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable outcomes needed to finish.
      placeholder: "- [ ] Describe a completion check"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and required input
      description: Link prerequisites and say which decisions or materials are needed. Write none if there are none.
    validations:
      required: true
